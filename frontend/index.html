    <!-- Primary SEO (defaults — SEOHead component overrides per-page) -->

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://riyadvisoftwaretechnologies.com/" />
    <meta property="og:title" content="Riyadvi Software Technologies | Custom Software & Digital Solutions" />

    <!-- Canonical -->
    <link rel="canonical" href="https://riyadvisoftwaretechnologies.com/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />

    <!-- Analytics & Tracking scripts are dynamically initialized via src/services/analytics.ts -->

    <script type="application/ld+json">

      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Riyadvi Software Technologies",
      "url": "https://riyadvisoftwaretechnologies.com",

      "address": {
        "@type": "PostalAddress",
        "addressCountry": "IN",
        "addressRegion": "Tamil Nadu"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",

      }
    }
    </script>

  <body class="bg-dark-bg text-gray-100 font-sans antialiased selection:bg-gold selection:text-black overflow-x-hidden">

      <img height="1" width="1" style="display:none"
        src="https://www.facebook.com/tr?id=XXXXXXXXXXXXXXXXXX&ev=PageView&noscript=1"
